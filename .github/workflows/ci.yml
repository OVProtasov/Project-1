name: funny_horoscope CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements_dev.txt
      - name: Run tests
        run: python3 -m pytest -v
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v7
      - name: Upload tested application
        uses: actions/checkout@v7
        with: 
          name: funny_horoscope
          path: |
            app_final.py
            requirements.txt
            README.md
          retention-days: 7